{% extends 'base.html' %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4">
      <h5 class="fw-bold mb-3"><i class="bi bi-key"></i> Change Password</h5>
      <form method="post" id="passwordForm">{% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Current Password</label>
          <div class="input-group">
            <input type="password" name="old_password" id="oldPassword" class="form-control" required maxlength="12">
            <button type="button" class="btn btn-outline-secondary" onclick="togglePassword('oldPassword', this)"><i class="bi bi-eye"></i></button>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">New Password <small class="text-muted">(8-12 chars)</small></label>
          <div class="input-group">
            <input type="password" name="new_password" id="newPassword" class="form-control" required minlength="8" maxlength="12">
            <button type="button" class="btn btn-outline-secondary" onclick="togglePassword('newPassword', this)"><i class="bi bi-eye"></i></button>
          </div>
          <div class="mt-2">
            <div class="progress" style="height:6px">
              <div id="passwordStrengthBar" class="progress-bar" style="width:0%;transition:width 0.3s"></div>
            </div>
            <small id="passwordStrengthText" class="text-muted"></small>
          </div>
          <div class="mt-2 p-2 bg-light rounded">
            <small class="fw-semibold text-muted">Password Requirements:</small>
            <div class="mt-1">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="reqMinLength" disabled>
                <label class="form-check-label small" for="reqMinLength">Minimum 8 characters</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="reqMaxLength" disabled>
                <label class="form-check-label small" for="reqMaxLength">Maximum 12 characters</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="reqLetters" disabled>
                <label class="form-check-label small" for="reqLetters">Contains letters (a-z, A-Z)</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="reqNumbers" disabled>
                <label class="form-check-label small" for="reqNumbers">Contains numbers (0-9)</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="reqSpecial" disabled>
                <label class="form-check-label small" for="reqSpecial">Contains special characters (!@#$%^&*)</label>
              </div>
            </div>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Confirm New Password</label>
          <div class="input-group">
            <input type="password" name="confirm_password" id="confirmPassword" class="form-control" required minlength="8" maxlength="12">
            <button type="button" class="btn btn-outline-secondary" onclick="togglePassword('confirmPassword', this)"><i class="bi bi-eye"></i></button>
          </div>
          <small id="passwordMatchText" class="text-muted"></small>
        </div>
        <button type="submit" class="btn btn-msict"><i class="bi bi-check-lg"></i> Update Password</button>
        <a href="{% url 'profile' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
(function () {
  const passwordInput = document.getElementById('newPassword');
  const strengthBar = document.getElementById('passwordStrengthBar');
  const strengthText = document.getElementById('passwordStrengthText');

  // Requirement checkboxes
  const reqMinLength = document.getElementById('reqMinLength');
  const reqMaxLength = document.getElementById('reqMaxLength');
  const reqLetters = document.getElementById('reqLetters');
  const reqNumbers = document.getElementById('reqNumbers');
  const reqSpecial = document.getElementById('reqSpecial');

  function calculateStrength(password) {
    let score = 0;
    if (password.length >= 8 && password.length <= 12) score += 30;
    if (/[a-zA-Z]/.test(password)) score += 25;
    if (/[0-9]/.test(password)) score += 25;
    if (/[^a-zA-Z0-9]/.test(password)) score += 20;
    return Math.min(100, score);
  }

  function getStrengthLabel(score) {
    if (score <= 30) return { label: 'Weak', color: 'bg-danger' };
    if (score <= 70) return { label: 'Medium', color: 'bg-warning' };
    return { label: 'Strong', color: 'bg-success' };
  }

  function updateRequirements(password) {
    // Update checkboxes based on password
    reqMinLength.checked = password.length >= 8;
    reqMaxLength.checked = password.length <= 12 && password.length > 0;
    reqLetters.checked = /[a-zA-Z]/.test(password);
    reqNumbers.checked = /[0-9]/.test(password);
    reqSpecial.checked = /[^a-zA-Z0-9]/.test(password);
  }

  passwordInput.addEventListener('input', function () {
    if (this.value.length > 12) {
      this.value = this.value.slice(0, 12);
    }
    updateRequirements(this.value);
    const score = calculateStrength(this.value);
    const { label, color } = getStrengthLabel(score);
    strengthBar.style.width = score + '%';
    strengthBar.className = 'progress-bar ' + color;
    strengthText.textContent = this.value ? label + ' (' + score + '%)' : '';
    checkMatch();
  });

  function checkMatch() {
    const newPass = document.getElementById('newPassword').value;
    const confirmPass = document.getElementById('confirmPassword').value;
    const matchText = document.getElementById('passwordMatchText');
    if (confirmPass) {
      if (newPass === confirmPass) {
        matchText.textContent = 'Passwords match';
        matchText.className = 'text-success fw-bold';
      } else {
        matchText.textContent = 'Passwords do not match';
        matchText.className = 'text-danger fw-bold';
      }
    } else {
      matchText.textContent = '';
    }
  }

  document.getElementById('confirmPassword').addEventListener('input', checkMatch);

  document.getElementById('passwordForm').addEventListener('submit', function(e) {
    const newPass = document.getElementById('newPassword').value;
    const score = calculateStrength(newPass);
    
    // Check all requirements
    if (newPass.length < 8) {
      e.preventDefault();
      alert('Password must be at least 8 characters long.');
      return false;
    }
    if (newPass.length > 12) {
      e.preventDefault();
      alert('Password must not exceed 12 characters.');
      return false;
    }
    if (!/[a-zA-Z]/.test(newPass)) {
      e.preventDefault();
      alert('Password must contain letters (a-z, A-Z).');
      return false;
    }
    if (!/[0-9]/.test(newPass)) {
      e.preventDefault();
      alert('Password must contain numbers (0-9).');
      return false;
    }
    if (!/[^a-zA-Z0-9]/.test(newPass)) {
      e.preventDefault();
      alert('Password must contain special characters (!@#$%^&*).');
      return false;
    }
    
    const confirmPass = document.getElementById('confirmPassword').value;
    if (newPass !== confirmPass) {
      e.preventDefault();
      alert('Passwords do not match.');
      return false;
    }
  });

  window.togglePassword = function(fieldId, btn) {
    const field = document.getElementById(fieldId);
    const icon = btn.querySelector('i');
    if (field.type === 'password') {
      field.type = 'text';
      icon.classList.remove('bi-eye');
      icon.classList.add('bi-eye-slash');
    } else {
      field.type = 'password';
      icon.classList.remove('bi-eye-slash');
      icon.classList.add('bi-eye');
    }
  };

  // Enforce max 12 characters on all password fields
  ['oldPassword', 'newPassword', 'confirmPassword'].forEach(function(id) {
    const field = document.getElementById(id);
    if (field) {
      field.addEventListener('input', function() {
        if (this.value.length > 12) {
          this.value = this.value.slice(0, 12);
        }
      });
    }
  });
})();
</script>
{% endblock %}
