<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500 — Server Error | MSICT OLMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background: #f1f5f9;
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh; text-align: center; padding: 2rem;
    }
    .err-code {
      font-size: 6rem; font-weight: 900; letter-spacing: -.02em;
      background: linear-gradient(135deg, #ef4444 0%, #f97316 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; line-height: 1;
    }
    .logo-bar { margin-bottom: 2.5rem; }
    .logo-bar img { height: 48px; }
  </style>
</head>
<body>
  <div class="logo-bar">
    <span class="fw-bold text-primary fs-5"><i class="bi bi-book-half me-2"></i>MSICT OLMS</span>
  </div>
  <div class="err-code mb-2">500</div>
  <h2 class="fw-bold mb-2">Internal Server Error</h2>
  <p class="text-muted mb-1" style="max-width:400px;">
    Something went wrong on our end. Our team has been notified.
  </p>
  <p class="text-muted small mb-4">Please try again in a few moments, or contact the system administrator.</p>
  <div class="d-flex flex-wrap gap-2 justify-content-center">
    <a href="/" class="btn btn-primary px-4">
      <i class="bi bi-house me-1"></i>Go Home
    </a>
    <a href="javascript:location.reload()" class="btn btn-outline-secondary px-4">
      <i class="bi bi-arrow-clockwise me-1"></i>Retry
    </a>
  </div>
  <div class="mt-5 text-muted small">
    <i class="bi bi-clock me-1"></i>{{ now|default:"" }}
    &nbsp;&middot;&nbsp;
    <i class="bi bi-shield-exclamation me-1"></i>Error has been logged
  </div>
</body>
</html>
