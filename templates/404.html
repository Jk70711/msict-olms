{% extends 'base.html' %}
{% block title %}404 — Page Not Found{% endblock %}
{% block content %}
<div class="d-flex flex-column align-items-center justify-content-center" style="min-height:60vh;text-align:center;">
  <div style="font-size:5rem;opacity:.15;font-weight:900;line-height:1;">404</div>
  <h2 class="fw-bold mb-2 mt-2">Page Not Found</h2>
  <p class="text-muted mb-4">The page you are looking for does not exist or has been moved.</p>
  <a href="{% url 'dashboard' %}" class="btn btn-primary">
    <i class="bi bi-house me-1"></i> Back to Dashboard
  </a>
</div>
{% endblock %}
